plugins { id 'com.android.application' }

android {
    namespace 'io.github.hakai963.granny'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.hakai963.granny"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.8.12-rust"
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
        assets.srcDirs = ['src/main/assets']
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
