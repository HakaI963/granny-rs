[package]
name = "granny-rs"
version = "1.8.12"
edition = "2021"
description = "Granny — faithful Rust reimplementation"

[dependencies]
wgpu = "22"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[lib]
name = "granny_rs"
path = "src/lib.rs"

[[bin]]
name = "granny-rs"
path = "src/main.rs"
